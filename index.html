const u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)), b64=b=>btoa(String.fromCharCode(...new Uint8Array(b)));
async function derive(pw){const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
  return crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:u8(SALT),iterations:ITER},base,256);}
async function decrypt(raw){const k=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:u8(IV)},k,u8(CT))));}
function run(p){

  document.body.innerHTML=p.body; window.__CARDS__=p.cards;
  const urls={}; const order=["m0","m1","m2","m3","m4","m5"];
  for(const m of order){ const code=p.mods[m].replace(/from '\.\/(\w+)\.js'/g,(_,n)=>"from '"+urls[n]+"'");

}
(async()=>{ const saved=localStorage.getItem(KEYSLOT);
